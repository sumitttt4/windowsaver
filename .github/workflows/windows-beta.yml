name: Windows beta checks and installer
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path core/Cargo.toml
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: npm ci
        working-directory: landing
      - run: npm run build
        working-directory: landing
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Feed-the-Pile-Windows-x64-unsigned-beta
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
