[package]
name = "pile-core"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
[target.'cfg(windows)'.dependencies]
trash = "=5.2.9"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_SystemServices", "Win32_Storage_EnhancedStorage"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
[dev-dependencies]
tempfile = "3"
filetime = "0.2"
